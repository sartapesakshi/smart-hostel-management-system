<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} - {{ hostel_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
<div class="auth-shell">
  <section class="auth-aside">
    <div class="auth-brand">{{ icon('building', 26) }}<span>{{ hostel_name }}</span></div>
    <div class="keytag" aria-hidden="true">
      <svg viewBox="0 0 220 300" width="190" height="260">
        <circle cx="110" cy="34" r="22" fill="none" stroke="#d9b36a" stroke-width="6"/>
        <path d="M110 56 V78" stroke="#d9b36a" stroke-width="6" stroke-linecap="round"/>
        <rect x="30" y="78" width="160" height="200" rx="26" fill="#c99a45"/>
        <rect x="42" y="90" width="136" height="176" rx="18" fill="none" stroke="#f1d9a2" stroke-width="2" stroke-dasharray="5 6"/>
        <circle cx="110" cy="116" r="9" fill="#17324d"/>
        <text x="110" y="196" text-anchor="middle" font-size="58" font-weight="700" fill="#17324d" font-family="Georgia, 'Times New Roman', serif">101</text>
        <text x="110" y="232" text-anchor="middle" font-size="15" fill="#17324d" font-family="Segoe UI, Arial, sans-serif">Floor 1</text>
      </svg>
    </div>
    <p class="auth-tagline">Rooms, residents, fees and day-to-day hostel work in one place.</p>
  </section>
  <section class="auth-panel">
    {% block panel %}{% endblock %}
  </section>
</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
